# ─────────────────────────────────────────────────────────────
#  Nginx Reverse Proxy Config — WAH4Hospital V2
#  Serves the Vite SPA and rewrites all routes to index.html
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache static assets (JS/CSS/images) for 1 year
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all routes point to index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the NestJS backend service
    location /api/ {
        proxy_pass http://nestjs-api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
